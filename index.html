<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HoloKudos — Decentralized Peer Recognition</title>
<style>
  :root {
    --bg: #0d0f14;
    --surface: #161a24;
    --border: #1e2535;
    --accent: #00e5b4;
    --accent2: #7c6ff7;
    --text: #e8eaf0;
    --muted: #6b7280;
    --danger: #ff4d6d;
    --gold: #f9c846;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  /* HEADER */
  header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 32px;
    border-bottom: 1px solid var(--border);
    background: #0b0d12;
    position: sticky; top: 0; z-index: 100;
  }
  .logo { display: flex; align-items: center; gap: 10px; }
  .logo-icon {
    width: 36px; height: 36px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px;
  }
  .logo-text { font-size: 20px; font-weight: 700; letter-spacing: -0.5px; }
  .logo-text span { color: var(--accent); }
  .tagline { font-size: 12px; color: var(--muted); margin-top: 2px; }
  .agent-badge {
    display: flex; align-items: center; gap: 8px;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 20px; padding: 6px 14px;
    font-size: 13px;
  }
  .agent-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:.4} }
  .agent-key { font-family: monospace; color: var(--accent); font-size: 12px; }

  /* LAYOUT */
  .container { max-width: 900px; margin: 0 auto; padding: 32px 16px; display: grid; grid-template-columns: 1fr 320px; gap: 24px; }
  @media(max-width:700px){ .container{ grid-template-columns:1fr; } }

  /* CARDS */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 16px; padding: 24px;
    margin-bottom: 16px;
  }
  .card-title { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 16px; }

  /* GIVE KUDOS FORM */
  .form-row { margin-bottom: 12px; }
  label { font-size: 12px; color: var(--muted); display: block; margin-bottom: 6px; }
  select, textarea, input[type=text] {
    width: 100%; background: var(--bg);
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); padding: 10px 14px; font-size: 14px;
    font-family: inherit; outline: none; transition: border-color .2s;
  }
  select:focus, textarea:focus, input:focus { border-color: var(--accent); }
  textarea { resize: none; min-height: 80px; }

  .category-grid { display: grid; grid-template-columns: repeat(3,1fr); gap: 8px; margin-bottom: 12px; }
  .cat-btn {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 6px; cursor: pointer;
    font-size: 12px; color: var(--muted); text-align: center;
    transition: all .15s; display: flex; flex-direction: column; align-items: center; gap: 4px;
  }
  .cat-btn:hover { border-color: var(--accent); color: var(--text); }
  .cat-btn.active { border-color: var(--accent); background: rgba(0,229,180,.08); color: var(--accent); }
  .cat-btn .cat-icon { font-size: 18px; }

  .btn {
    width: 100%; padding: 12px; border: none; border-radius: 10px;
    font-size: 14px; font-weight: 600; cursor: pointer;
    background: linear-gradient(135deg, var(--accent), #00b890);
    color: #0a1a14; transition: opacity .15s;
  }
  .btn:hover { opacity: .85; }
  .btn:active { opacity: .7; }

  /* KUDOS FEED */
  .feed-title { font-size: 18px; font-weight: 700; margin-bottom: 20px; display: flex; align-items: center; gap: 8px; }
  .live-dot { width: 8px; height: 8px; background: var(--accent); border-radius: 50%; animation: pulse 2s infinite; }

  .kudo-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 18px; margin-bottom: 12px;
    animation: fadeIn .4s ease;
    transition: border-color .2s;
    position: relative; overflow: hidden;
  }
  .kudo-card:hover { border-color: rgba(0,229,180,.3); }
  .kudo-card::before {
    content: ''; position: absolute; left: 0; top: 0; bottom: 0;
    width: 3px; background: linear-gradient(to bottom, var(--accent), var(--accent2));
    border-radius: 2px 0 0 2px;
  }
  @keyframes fadeIn { from{opacity:0;transform:translateY(-8px)} to{opacity:1;transform:translateY(0)} }

  .kudo-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .kudo-agents { display: flex; align-items: center; gap: 6px; font-size: 13px; }
  .agent-pill {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 20px; padding: 3px 10px;
    font-family: monospace; font-size: 11px; color: var(--accent2);
  }
  .arrow { color: var(--muted); }
  .recipient-pill {
    background: rgba(0,229,180,.1); border: 1px solid rgba(0,229,180,.25);
    border-radius: 20px; padding: 3px 10px;
    font-family: monospace; font-size: 11px; color: var(--accent);
  }

  .kudo-cat { display: flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
  .kudo-cat .tag {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; padding: 2px 8px; font-size: 11px;
  }

  .kudo-msg { font-size: 14px; line-height: 1.6; margin: 10px 0; color: var(--text); }

  .kudo-footer { display: flex; align-items: center; justify-content: space-between; }
  .sig-info { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .sig-valid { color: var(--accent); }
  .timestamp { font-size: 11px; color: var(--muted); }
  .dht-tag {
    font-size: 10px; font-family: monospace;
    background: rgba(124,111,247,.1); border: 1px solid rgba(124,111,247,.25);
    color: var(--accent2); border-radius: 6px; padding: 2px 7px;
  }

  /* RIGHT SIDEBAR */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
  .stat-box {
    background: var(--bg); border: 1px solid var(--border);
    border-radius: 10px; padding: 12px; text-align: center;
  }
  .stat-num { font-size: 24px; font-weight: 700; color: var(--accent); }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 2px; }

  /* LEADERBOARD */
  .leader-row {
    display: flex; align-items: center; gap: 10px;
    padding: 10px 0; border-bottom: 1px solid var(--border);
  }
  .leader-row:last-child { border-bottom: none; }
  .leader-rank { font-size: 16px; width: 24px; text-align: center; }
  .leader-info { flex: 1; }
  .leader-name { font-size: 13px; font-weight: 600; }
  .leader-key { font-family: monospace; font-size: 10px; color: var(--muted); }
  .leader-count {
    background: rgba(0,229,180,.1); color: var(--accent);
    border-radius: 20px; padding: 3px 10px; font-size: 12px; font-weight: 700;
  }

  /* DHT VIZ */
  .dht-canvas-wrap { position: relative; }
  canvas { width: 100%; border-radius: 10px; }

  /* TOAST */
  #toast {
    position: fixed; bottom: 32px; left: 50%; transform: translateX(-50%) translateY(80px);
    background: var(--accent); color: #0a1a14;
    padding: 12px 24px; border-radius: 20px; font-weight: 600; font-size: 14px;
    transition: transform .3s ease; z-index: 999; pointer-events: none;
  }
  #toast.show { transform: translateX(-50%) translateY(0); }

  /* HASH display */
  .hash-preview {
    font-family: monospace; font-size: 10px; color: var(--muted);
    word-break: break-all; margin-top: 6px; padding: 6px 8px;
    background: var(--bg); border-radius: 6px; border: 1px solid var(--border);
    display: none;
  }
</style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">⚡</div>
    <div>
      <div class="logo-text">Holo<span>Kudos</span></div>
      <div class="tagline">Decentralized Peer Recognition · Powered by Holochain</div>
    </div>
  </div>
  <div class="agent-badge">
    <div class="agent-dot"></div>
    <span>You:</span>
    <span class="agent-key" id="myKey">loading…</span>
  </div>
</header>

<div class="container">
  <!-- LEFT: FEED + FORM -->
  <div>
    <!-- GIVE KUDOS -->
    <div class="card">
      <div class="card-title">Give Kudos</div>
      <div class="form-row">
        <label>To (Agent)</label>
        <select id="toAgent">
          <option value="">Select a peer…</option>
        </select>
      </div>
      <div class="form-row">
        <label>Category</label>
        <div class="category-grid" id="catGrid"></div>
      </div>
      <div class="form-row">
        <label>Message (signed & stored on DHT)</label>
        <textarea id="kudoMsg" placeholder="What did they do? Be specific — this is permanent and verifiable…" maxlength="280"></textarea>
      </div>
      <div class="hash-preview" id="hashPreview"></div>
      <button class="btn" onclick="giveKudo()">⚡ Sign & Broadcast to DHT</button>
    </div>

    <!-- FEED -->
    <div class="feed-title">
      <div class="live-dot"></div>
      Live DHT Feed
    </div>
    <div id="feed"></div>
  </div>

  <!-- RIGHT: SIDEBAR -->
  <div>
    <!-- STATS -->
    <div class="card">
      <div class="card-title">Network Stats</div>
      <div class="stat-grid">
        <div class="stat-box">
          <div class="stat-num" id="statKudos">0</div>
          <div class="stat-label">Total Kudos</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="statPeers">6</div>
          <div class="stat-label">Peers Online</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="statNodes">12</div>
          <div class="stat-label">DHT Nodes</div>
        </div>
        <div class="stat-box">
          <div class="stat-num" id="statValid">100%</div>
          <div class="stat-label">Verified</div>
        </div>
      </div>
    </div>

    <!-- LEADERBOARD -->
    <div class="card">
      <div class="card-title">Top Recipients</div>
      <div id="leaderboard"></div>
    </div>

    <!-- DHT VIZ -->
    <div class="card">
      <div class="card-title">DHT Network</div>
      <div class="dht-canvas-wrap">
        <canvas id="dhtCanvas" height="200"></canvas>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
// ─── SIMULATED HOLOCHAIN LAYER ───────────────────────────────────────────────

// Fake keypair generation (simulates ed25519 agent IDs)
function fakeKey() {
  const chars = '0123456789abcdef';
  return Array.from({length: 64}, () => chars[Math.floor(Math.random() * 16)]).join('');
}

function shortKey(k) { return k.slice(0, 6) + '…' + k.slice(-4); }

function fakeHash(data) {
  let h = 0;
  for (let c of data) h = (Math.imul(31, h) + c.charCodeAt(0)) | 0;
  const hex = Math.abs(h).toString(16).padStart(8, '0');
  return 'uhCkk' + hex + fakeKey().slice(0, 32);
}

function signEntry(agentKey, data) {
  // Simulates deterministic signature derived from agent key + data
  return fakeHash(agentKey + data).slice(0, 44);
}

const categories = [
  { id: 'collab', icon: '🤝', label: 'Collaboration' },
  { id: 'code',   icon: '💻', label: 'Code Quality' },
  { id: 'mentor', icon: '🎓', label: 'Mentorship' },
  { id: 'idea',   icon: '💡', label: 'Innovation' },
  { id: 'help',   icon: '🛠', label: 'Helpfulness' },
  { id: 'comms',  icon: '📣', label: 'Communication' },
];

const PEER_NAMES = ['Alice', 'Bob', 'Carol', 'Dave', 'Eve', 'Frank'];
let peers = PEER_NAMES.map(name => ({ name, key: fakeKey() }));
let myAgent = { name: 'You', key: fakeKey() };
let selectedCat = 'collab';
let kudos = [];

// ─── SEED FEED ───────────────────────────────────────────────────────────────
const SEED_KUDOS = [
  { from: 0, to: 1, cat: 'code',   msg: 'Refactored the validation module with zero regressions. Clean, efficient, and well-documented. Exactly what open-source should look like.' },
  { from: 2, to: 0, cat: 'mentor', msg: 'Spent two hours helping me understand zome calls. Never made me feel dumb. Rare quality in any community.' },
  { from: 3, to: 4, cat: 'idea',   msg: 'The gossip protocol optimization idea cut our DHT lookup latency by 40%. Brilliant architecture thinking.' },
  { from: 1, to: 5, cat: 'help',   msg: 'Dropped everything to debug my conductor setup at 11pm. Absolute legend.' },
  { from: 4, to: 2, cat: 'collab', msg: 'Co-authored three zomes in a week with perfect coordination. Made the whole sprint feel effortless.' },
];

function initSeed() {
  SEED_KUDOS.forEach((k, i) => {
    setTimeout(() => {
      const from = peers[k.from];
      const to   = peers[k.to];
      const ts   = Date.now() - (SEED_KUDOS.length - i) * 180000;
      addKudo({ from, to, cat: k.cat, msg: k.msg, ts, animate: false });
    }, i * 120);
  });
}

// ─── UI INIT ─────────────────────────────────────────────────────────────────
document.getElementById('myKey').textContent = shortKey(myAgent.key);

// Populate peer dropdown
const sel = document.getElementById('toAgent');
peers.forEach((p, i) => {
  const o = document.createElement('option');
  o.value = i;
  o.textContent = `${p.name} · ${shortKey(p.key)}`;
  sel.appendChild(o);
});

// Category grid
const catGrid = document.getElementById('catGrid');
categories.forEach(c => {
  const btn = document.createElement('button');
  btn.className = 'cat-btn' + (c.id === selectedCat ? ' active' : '');
  btn.innerHTML = `<span class="cat-icon">${c.icon}</span>${c.label}`;
  btn.onclick = () => {
    document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    selectedCat = c.id;
  };
  catGrid.appendChild(btn);
});

// Live hash preview
document.getElementById('kudoMsg').addEventListener('input', function() {
  const hp = document.getElementById('hashPreview');
  if (this.value.length > 10) {
    hp.style.display = 'block';
    hp.textContent = 'Entry hash: ' + fakeHash(myAgent.key + this.value);
  } else {
    hp.style.display = 'none';
  }
});

// ─── GIVE KUDO ───────────────────────────────────────────────────────────────
function giveKudo() {
  const toIdx = document.getElementById('toAgent').value;
  const msg   = document.getElementById('kudoMsg').value.trim();
  if (!toIdx) return showToast('Select a peer first!');
  if (!msg)   return showToast('Write a message!');

  const to   = peers[parseInt(toIdx)];
  const from = myAgent;
  addKudo({ from, to, cat: selectedCat, msg, ts: Date.now(), animate: true });

  document.getElementById('kudoMsg').value = '';
  document.getElementById('hashPreview').style.display = 'none';
  document.getElementById('toAgent').value = '';
  showToast('⚡ Kudo signed & broadcast to DHT!');
}

// ─── ADD KUDO TO FEED ────────────────────────────────────────────────────────
function addKudo({ from, to, cat, msg, ts, animate }) {
  const catObj = categories.find(c => c.id === cat) || categories[0];
  const entryData = from.key + to.key + cat + msg + ts;
  const hash = fakeHash(entryData);
  const sig  = signEntry(from.key, entryData);

  const kudo = { from, to, cat: catObj, msg, ts, hash, sig, animate };
  kudos.unshift(kudo);

  renderFeed();
  updateStats();
  updateLeaderboard();
  pulseDHT();
}

function timeAgo(ts) {
  const diff = Date.now() - ts;
  if (diff < 60000) return 'just now';
  if (diff < 3600000) return Math.floor(diff/60000) + 'm ago';
  if (diff < 86400000) return Math.floor(diff/3600000) + 'h ago';
  return Math.floor(diff/86400000) + 'd ago';
}

function renderFeed() {
  const feed = document.getElementById('feed');
  feed.innerHTML = '';
  kudos.forEach((k, i) => {
    const div = document.createElement('div');
    div.className = 'kudo-card';
    div.innerHTML = `
      <div class="kudo-header">
        <div class="kudo-agents">
          <span class="agent-pill">${k.from.name === 'You' ? '🟢 You' : shortKey(k.from.key)}</span>
          <span class="arrow">→</span>
          <span class="recipient-pill">${k.to.name} · ${shortKey(k.to.key)}</span>
        </div>
        <div class="kudo-cat">
          <span>${k.cat.icon}</span>
          <span class="tag">${k.cat.label}</span>
        </div>
      </div>
      <div class="kudo-msg">"${k.msg}"</div>
      <div class="kudo-footer">
        <div class="sig-info">
          <span class="sig-valid">✓</span>
          <span>sig: ${k.sig.slice(0,12)}…</span>
          <span>·</span>
          <span class="dht-tag">${k.hash.slice(0,12)}…</span>
        </div>
        <div class="timestamp">${timeAgo(k.ts)}</div>
      </div>
    `;
    feed.appendChild(div);
  });
}

// ─── STATS ───────────────────────────────────────────────────────────────────
function updateStats() {
  document.getElementById('statKudos').textContent = kudos.length;
}

function updateLeaderboard() {
  const counts = {};
  kudos.forEach(k => {
    const name = k.to.name;
    counts[name] = (counts[name] || 0) + 1;
  });
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5);
  const medals = ['🥇', '🥈', '🥉', '4', '5'];
  const lb = document.getElementById('leaderboard');
  lb.innerHTML = sorted.length ? sorted.map(([name, n], i) => `
    <div class="leader-row">
      <div class="leader-rank">${medals[i]}</div>
      <div class="leader-info">
        <div class="leader-name">${name}</div>
        <div class="leader-key">${shortKey(peers.find(p=>p.name===name)?.key || myAgent.key)}</div>
      </div>
      <div class="leader-count">${n} kudos</div>
    </div>
  `).join('') : '<div style="color:var(--muted);font-size:13px;text-align:center;padding:16px">No kudos yet…</div>';
}

// ─── DHT CANVAS ──────────────────────────────────────────────────────────────
const canvas = document.getElementById('dhtCanvas');
const ctx    = canvas.getContext('2d');
let nodes = [];
let pulseNodes = [];

function initDHT() {
  canvas.width  = canvas.offsetWidth * devicePixelRatio;
  canvas.height = 200 * devicePixelRatio;
  ctx.scale(devicePixelRatio, devicePixelRatio);
  const W = canvas.offsetWidth, H = 200;
  const allPeers = [myAgent, ...peers];
  nodes = allPeers.map((p, i) => {
    const angle = (i / allPeers.length) * Math.PI * 2 - Math.PI / 2;
    const r = 70;
    return {
      x: W/2 + Math.cos(angle) * r,
      y: H/2 + Math.sin(angle) * r,
      label: p.name === 'You' ? '●You' : p.name[0],
      isMe: p.name === 'You',
      pulse: 0
    };
  });
  drawDHT();
}

function pulseDHT() {
  nodes.forEach(n => { n.pulse = 1; });
  setTimeout(() => nodes.forEach(n => { n.pulse = 0; }), 800);
  drawDHT();
}

function drawDHT() {
  const W = canvas.offsetWidth, H = 200;
  ctx.clearRect(0, 0, W, H);

  // Draw edges
  nodes.forEach((a, i) => {
    nodes.forEach((b, j) => {
      if (j <= i) return;
      ctx.beginPath();
      ctx.moveTo(a.x, a.y);
      ctx.lineTo(b.x, b.y);
      ctx.strokeStyle = 'rgba(30,37,53,.8)';
      ctx.lineWidth = 1;
      ctx.stroke();
    });
  });

  // Draw nodes
  nodes.forEach(n => {
    const glow = n.pulse > 0;
    if (glow) {
      ctx.beginPath();
      ctx.arc(n.x, n.y, 18, 0, Math.PI*2);
      ctx.fillStyle = 'rgba(0,229,180,.12)';
      ctx.fill();
    }
    ctx.beginPath();
    ctx.arc(n.x, n.y, n.isMe ? 10 : 7, 0, Math.PI*2);
    ctx.fillStyle = n.isMe ? '#00e5b4' : (glow ? '#7c6ff7' : '#1e2535');
    ctx.strokeStyle = n.isMe ? '#00b890' : (glow ? '#7c6ff7' : '#2d3748');
    ctx.lineWidth = 2;
    ctx.fill();
    ctx.stroke();

    ctx.fillStyle = n.isMe ? '#0a1a14' : (glow ? '#e8eaf0' : '#6b7280');
    ctx.font = `bold ${n.isMe ? 8 : 9}px monospace`;
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(n.label, n.x, n.y);
  });
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2500);
}

// ─── BOOT ────────────────────────────────────────────────────────────────────
window.addEventListener('load', () => {
  initDHT();
  initSeed();
  updateLeaderboard();
});

window.addEventListener('resize', () => { initDHT(); });
</script>
</body>
</html>
